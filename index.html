<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YouTube Comment Finder</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Noto+Sans+JP:wght@300;400;700&display=swap" rel="stylesheet">
<style>
  /* 600行辺りまでCSS */
  :root {
    --bg: #0a0a0f;
    --surface: #13131a;
    --surface2: #1c1c28;
    --border: #2a2a3d;
    --accent: #ff4d6d;
    --accent2: #7b61ff;
    --text: #e8e8f0;
    --muted: #6b6b8a;
    --success: #22c55e;
    --warning: #f59e0b;
    --mono: 'Space Mono', monospace;
    --sans: 'Noto Sans JP', sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Background grid */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(123,97,255,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(123,97,255,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }

  .container {
    max-width: 960px;
    margin: 0 auto;
    padding: 40px 24px;
    position: relative;
    z-index: 1;
  }

  header {
    margin-bottom: 48px;
    display: flex;
    align-items: flex-start;
    gap: 16px;
  }

  .logo-mark {
    width: 48px;
    height: 48px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--mono);
    font-weight: 700;
    font-size: 18px;
    color: white;
    flex-shrink: 0;
    margin-top: 4px;
  }

  h1 {
    font-family: var(--mono);
    font-size: clamp(20px, 4vw, 28px);
    font-weight: 700;
    line-height: 1.2;
    letter-spacing: -0.5px;
  }

  h1 span {
    display: block;
    font-size: 13px;
    font-weight: 400;
    color: var(--muted);
    font-family: var(--sans);
    margin-top: 4px;
    letter-spacing: 0;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 32px;
    margin-bottom: 24px;
  }

  .card-title {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 24px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .card-title::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  .form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }

  .form-group {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .form-group.full { grid-column: 1 / -1; }

  label {
    font-size: 12px;
    font-weight: 700;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 1px;
    font-family: var(--mono);
  }

  input, select {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 16px;
    color: var(--text);
    font-family: var(--sans);
    font-size: 14px;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
    width: 100%;
  }

  input:focus, select:focus {
    border-color: var(--accent2);
    box-shadow: 0 0 0 3px rgba(123,97,255,0.15);
  }

  input::placeholder { color: var(--muted); }

  select option { background: var(--surface2); }

  .hint {
    font-size: 11px;
    color: var(--muted);
    margin-top: 4px;
    line-height: 1.5;
  }

  .hint a {
    color: var(--accent2);
    text-decoration: none;
  }

  .hint a:hover { text-decoration: underline; }

  .date-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }

  .date-selects {
    display: grid;
    grid-template-columns: 90px 1fr 1fr;
    gap: 6px;
  }

  .date-year-input {
    -moz-appearance: textfield;
  }
  .date-year-input::-webkit-outer-spin-button,
  .date-year-input::-webkit-inner-spin-button {
    -webkit-appearance: none;
    margin: 0;
  }

  .btn-search {
    width: 100%;
    padding: 16px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border: none;
    border-radius: 10px;
    color: white;
    font-family: var(--mono);
    font-weight: 700;
    font-size: 14px;
    letter-spacing: 1px;
    cursor: pointer;
    margin-top: 24px;
    transition: opacity 0.2s, transform 0.1s;
    position: relative;
    overflow: hidden;
  }

  .btn-search:hover { opacity: 0.9; transform: translateY(-1px); }
  .btn-search:active { transform: translateY(0); }
  .btn-search:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

  /* Loading */
  .loading {
    display: none;
    text-align: center;
    padding: 48px;
  }

  .spinner {
    width: 40px;
    height: 40px;
    border: 3px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin: 0 auto 16px;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .loading p {
    color: var(--muted);
    font-size: 14px;
    font-family: var(--mono);
  }

  /* Error */
  .error-box {
    display: none;
    background: rgba(255,77,109,0.1);
    border: 1px solid rgba(255,77,109,0.3);
    border-radius: 10px;
    padding: 16px 20px;
    color: var(--accent);
    font-size: 14px;
    margin-bottom: 24px;
  }

  /* Stats bar */
  .stats-bar {
    display: none;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
    margin-bottom: 24px;
  }

  .stat {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    text-align: center;
  }

  .stat-num {
    font-family: var(--mono);
    font-size: 32px;
    font-weight: 700;
    line-height: 1;
    margin-bottom: 6px;
  }

  .stat-label {
    font-size: 11px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  .stat.matched .stat-num { color: var(--success); }
  .stat.not-matched .stat-num { color: var(--muted); }
  .stat.total .stat-num { color: var(--accent2); }

  /* Results */
  .results-section { margin-bottom: 32px; }

  .section-header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 16px;
  }

  .section-badge {
    font-family: var(--mono);
    font-size: 11px;
    padding: 4px 10px;
    border-radius: 20px;
    font-weight: 700;
    letter-spacing: 1px;
  }

  .badge-match {
    background: rgba(34,197,94,0.15);
    color: var(--success);
    border: 1px solid rgba(34,197,94,0.3);
  }

  .badge-nomatch {
    background: rgba(107,107,138,0.15);
    color: var(--muted);
    border: 1px solid var(--border);
  }

  .section-title {
    font-family: var(--mono);
    font-size: 14px;
    font-weight: 700;
  }

  .video-list {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .video-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    transition: border-color 0.2s;
  }

  .video-card:hover { border-color: var(--accent2); }

  .video-card.matched { border-left: 3px solid var(--success); }
  .video-card.not-matched { opacity: 0.5; }

  .video-header {
    display: flex;
    gap: 16px;
    padding: 16px;
    cursor: pointer;
    align-items: center;
  }

  .video-thumb {
    width: 120px;
    height: 68px;
    object-fit: cover;
    border-radius: 6px;
    flex-shrink: 0;
    background: var(--surface2);
  }

  .video-info { flex: 1; min-width: 0; }

  .video-title {
    font-size: 14px;
    font-weight: 700;
    line-height: 1.4;
    margin-bottom: 6px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .video-meta {
    font-size: 11px;
    color: var(--muted);
    font-family: var(--mono);
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
  }

  .match-count {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    background: rgba(34,197,94,0.15);
    color: var(--success);
    border-radius: 6px;
    padding: 3px 8px;
    font-size: 11px;
    font-family: var(--mono);
    font-weight: 700;
  }

  .expand-btn {
    background: none;
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--muted);
    padding: 6px 10px;
    font-size: 11px;
    cursor: pointer;
    font-family: var(--mono);
    transition: all 0.2s;
    flex-shrink: 0;
    white-space: nowrap;
  }

  .expand-btn:hover {
    border-color: var(--accent2);
    color: var(--text);
  }

  .video-link {
    color: var(--accent2);
    text-decoration: none;
    font-size: 11px;
    font-family: var(--mono);
  }

  .video-link:hover { text-decoration: underline; }

  /* Comments */
  .comments-section {
    display: none;
    border-top: 1px solid var(--border);
    padding: 16px;
    background: var(--surface2);
    gap: 10px;
    flex-direction: column;
  }

  .comments-section.open { display: flex; }

  .comment-item {
    background: var(--surface);
    border-radius: 8px;
    padding: 12px 14px;
    border: 1px solid var(--border);
  }

  .comment-author {
    font-size: 11px;
    font-weight: 700;
    color: var(--accent2);
    font-family: var(--mono);
    margin-bottom: 6px;
  }

  .comment-text {
    font-size: 13px;
    line-height: 1.6;
    color: var(--text);
  }

  .comment-text mark {
    background: rgba(255,77,109,0.25);
    color: var(--accent);
    border-radius: 3px;
    padding: 0 2px;
  }

  .comment-meta {
    font-size: 10px;
    color: var(--muted);
    font-family: var(--mono);
    margin-top: 6px;
  }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: var(--surface); }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  @media (max-width: 600px) {
    .form-grid, .date-row { grid-template-columns: 1fr; }
    .stats-bar { grid-template-columns: 1fr; }
    .video-thumb { width: 80px; height: 45px; }
  }
</style>
</head>
<body>
<div class="container">

  <header>
    <div class="logo-mark">YT</div>
    <h1>
      YouTube Comment Finder
      <span>チャンネルの過去ライブ配信をコメントキーワードで検索・フィルタリング</span>
    </h1>
  </header>

  <!-- Search Form -->
  <div class="card">
    <div class="card-title">検索条件</div>
    <div class="form-grid">
      <div class="form-group full">
        <label>チャンネル URL</label>
        <input type="text" id="channelUrl" placeholder="https://www.youtube.com/@channelname または https://www.youtube.com/channel/UC...">
        <div class="hint">@handle形式・/channel/UC...・/c/・/user/ など各種URL形式に対応</div>
      </div>

      <div class="form-group full">
        <label>検索キーワード</label>
        <input type="text" id="keyword" placeholder="例：ありがとう、感謝、最高など">
      </div>

      <div class="form-group">
        <label>開始日（From）</label>
        <div class="date-selects">
          <input type="number" id="dateFromYear" placeholder="例: 2024" min="2005" max="2099" class="date-year-input">
          <select id="dateFromMonth"><option value="">月</option></select>
          <select id="dateFromDay"><option value="">日</option></select>
        </div>
      </div>

      <div class="form-group">
        <label>終了日（To）</label>
        <div class="date-selects">
          <input type="number" id="dateToYear" placeholder="例: 2024" min="2005" max="2099" class="date-year-input">
          <select id="dateToMonth"><option value="">月</option></select>
          <select id="dateToDay"><option value="">日</option></select>
        </div>
      </div>

      <div class="form-group full">
        <label>取得動画数（最大）</label>
        <select id="maxVideos">
          <option value="10">10件</option>
          <option value="20" selected>20件</option>
          <option value="50">50件</option>
          <option value="100">100件（APIクォータに注意）</option>
        </select>
        <div class="hint">ライブ配信のみ取得します。各配信のコメント上位20件（関連度順）を1ユニットで検索します。</div>
      </div>
    </div>

    <button class="btn-search" onclick="startSearch()" id="searchBtn">
      🔍 &nbsp; 検索開始
    </button>
  </div>

  <!-- Error -->
  <div class="error-box" id="errorBox"></div>

  <!-- Loading -->
  <div class="loading" id="loading">
    <div class="spinner"></div>
    <p id="loadingMsg">動画を取得中...</p>
  </div>

  <!-- Stats -->
  <div class="stats-bar" id="statsBar">
    <div class="stat total">
      <div class="stat-num" id="statTotal">0</div>
      <div class="stat-label">取得動画数</div>
    </div>
    <div class="stat matched">
      <div class="stat-num" id="statMatched">0</div>
      <div class="stat-label">コメント一致</div>
    </div>
    <div class="stat not-matched">
      <div class="stat-num" id="statNotMatched">0</div>
      <div class="stat-label">一致なし</div>
    </div>
  </div>

  <!-- Results: Matched -->
  <div class="results-section" id="matchedSection" style="display:none">
    <div class="section-header">
      <span class="section-badge badge-match">✓ MATCHED</span>
      <span class="section-title">コメントにキーワードが含まれる動画</span>
    </div>
    <div class="video-list" id="matchedList"></div>
  </div>

  <!-- Results: Not Matched (collapsed by default) -->
  <div class="results-section" id="notMatchedSection" style="display:none">
    <div class="section-header">
      <span class="section-badge badge-nomatch">✗ NO MATCH</span>
      <span class="section-title">一致なし（除外対象）</span>
      <button class="expand-btn" onclick="toggleNotMatched()" id="notMatchedToggle">表示する</button>
    </div>
    <div class="video-list" id="notMatchedList" style="display:none"></div>
  </div>

</div>

<script>
  // --- 月・日プルダウンの生成 ---
  function buildMonthOptions(selectId) {
    const sel = document.getElementById(selectId);
    for (let m = 1; m <= 12; m++) {
      const o = document.createElement('option');
      o.value = String(m).padStart(2, '0');
      o.textContent = m + '月';
      sel.appendChild(o);
    }
  }

  function buildDayOptions(selectId) {
    const sel = document.getElementById(selectId);
    for (let d = 1; d <= 31; d++) {
      const o = document.createElement('option');
      o.value = String(d).padStart(2, '0');
      o.textContent = d + '日';
      sel.appendChild(o);
    }
  }

  buildMonthOptions('dateFromMonth');
  buildDayOptions('dateFromDay');
  buildMonthOptions('dateToMonth');
  buildDayOptions('dateToDay');

  // 年・月・日 → "YYYY-MM-DD" or "" に変換
  function buildDateString(yearId, monthId, dayId) {
    const y = document.getElementById(yearId).value.trim();
    const m = document.getElementById(monthId).value;
    const d = document.getElementById(dayId).value;
    if (!y) return '';
    const mm = m || '01';
    const dd = d || '01';
    return `${y}-${mm}-${dd}`;
  }

  function toggleNotMatched() {
    const list = document.getElementById('notMatchedList');
    const btn = document.getElementById('notMatchedToggle');
    if (list.style.display === 'none') {
      list.style.display = 'flex';
      list.style.flexDirection = 'column';
      list.style.gap = '12px';
      btn.textContent = '非表示にする';
    } else {
      list.style.display = 'none';
      btn.textContent = '表示する';
    }
  }

  function highlightKeyword(text, keyword) {
    if (!keyword) return text;
    const escaped = keyword.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    const regex = new RegExp(escaped, 'gi');
    return text.replace(regex, match => `<mark>${match}</mark>`);
  }

  function formatDate(iso) {
    if (!iso) return '';
    return new Date(iso).toLocaleDateString('ja-JP', { year:'numeric', month:'2-digit', day:'2-digit' });
  }

  function renderVideoCard(video, isMatched, keyword) {
    const videoUrl = `https://www.youtube.com/watch?v=${video.video_id}`;
    const cardId = `card-${video.video_id}`;
    const commentsId = `comments-${video.video_id}`;

    let commentsHtml = '';
    if (isMatched && video.matched_comments) {
      commentsHtml = video.matched_comments.map(c => `
        <div class="comment-item">
          <div class="comment-author">@${c.author}</div>
          <div class="comment-text">${highlightKeyword(c.text.replace(/</g,'&lt;').replace(/>/g,'&gt;'), keyword)}</div>
          <div class="comment-meta">👍 ${c.like_count} &nbsp;•&nbsp; ${formatDate(c.published_at)}</div>
        </div>
      `).join('');
    }

    return `
      <div class="video-card ${isMatched ? 'matched' : 'not-matched'}" id="${cardId}">
        <div class="video-header" onclick="${isMatched ? `toggleComments('${commentsId}')` : ''}">
          <img class="video-thumb" src="${video.thumbnail}" alt="" loading="lazy" onerror="this.style.display='none'">
          <div class="video-info">
            <div class="video-title">${video.title.replace(/</g,'&lt;')}</div>
            <div class="video-meta">
              <span>${formatDate(video.published_at)}</span>
              ${isMatched ? `<span class="match-count">💬 ${video.match_count}件一致</span>` : '<span>一致なし</span>'}
            </div>
            <a class="video-link" href="${videoUrl}" target="_blank" onclick="event.stopPropagation()">▶ 動画を開く</a>
          </div>
          ${isMatched ? `<button class="expand-btn" onclick="toggleComments('${commentsId}'); event.stopPropagation()">コメントを見る</button>` : ''}
        </div>
        ${isMatched ? `<div class="comments-section" id="${commentsId}">${commentsHtml}</div>` : ''}
      </div>
    `;
  }

  function toggleComments(id) {
    const el = document.getElementById(id);
    if (el) el.classList.toggle('open');
  }

  async function startSearch() {
    const channelUrl = document.getElementById('channelUrl').value.trim();
    const keyword = document.getElementById('keyword').value.trim();
    const dateFrom = buildDateString('dateFromYear', 'dateFromMonth', 'dateFromDay');
    const dateTo   = buildDateString('dateToYear',   'dateToMonth',   'dateToDay');
    const maxVideos = document.getElementById('maxVideos').value;

    // Validation
    const errorBox = document.getElementById('errorBox');
    errorBox.style.display = 'none';

    if (!channelUrl || !keyword) {
      errorBox.textContent = '⚠️ チャンネルURLとキーワードは必須です。';
      errorBox.style.display = 'block';
      return;
    }

    // UI state
    document.getElementById('searchBtn').disabled = true;
    document.getElementById('loading').style.display = 'block';
    document.getElementById('statsBar').style.display = 'none';
    document.getElementById('matchedSection').style.display = 'none';
    document.getElementById('notMatchedSection').style.display = 'none';
    document.getElementById('matchedList').innerHTML = '';
    document.getElementById('notMatchedList').innerHTML = '';

    try {
      document.getElementById('loadingMsg').textContent = '動画を取得中... しばらくお待ちください';

      const res = await fetch('/search', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ channel_url: channelUrl, keyword, date_from: dateFrom, date_to: dateTo, max_videos: maxVideos })
      });

      const data = await res.json();

      if (!res.ok) {
        throw new Error(data.error || 'サーバーエラーが発生しました');
      }

      // Stats
      document.getElementById('statTotal').textContent = data.total_videos;
      document.getElementById('statMatched').textContent = data.matched.length;
      document.getElementById('statNotMatched').textContent = data.not_matched.length;
      document.getElementById('statsBar').style.display = 'grid';

      // Matched
      if (data.matched.length > 0) {
        document.getElementById('matchedSection').style.display = 'block';
        document.getElementById('matchedList').innerHTML = data.matched.map(v => renderVideoCard(v, true, data.keyword)).join('');
      }

      // Not matched
      if (data.not_matched.length > 0) {
        document.getElementById('notMatchedSection').style.display = 'block';
        document.getElementById('notMatchedList').innerHTML = data.not_matched.map(v => renderVideoCard(v, false, data.keyword)).join('');
      }

      if (data.matched.length === 0 && data.not_matched.length === 0) {
        errorBox.textContent = '⚠️ 指定期間内に動画が見つかりませんでした。';
        errorBox.style.display = 'block';
      }

    } catch (err) {
      errorBox.textContent = `❌ ${err.message}`;
      errorBox.style.display = 'block';
    } finally {
      document.getElementById('loading').style.display = 'none';
      document.getElementById('searchBtn').disabled = false;
    }
  }

  // Enter key support
  document.addEventListener('keydown', e => {
    if (e.key === 'Enter' && e.target.tagName === 'INPUT') startSearch();
  });
</script>
</body>
</html>
